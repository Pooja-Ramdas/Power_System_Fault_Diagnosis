<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="triadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00ffaa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background hex shield -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#070d18" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Inner triad triangle -->
  <polygon points="32,14 50,48 14,48" fill="none" stroke="url(#triadGrad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Central pulse node -->
  <circle cx="32" cy="37" r="4" fill="#00f0ff" />
  <!-- Vertex nodes (3 modalities: Diagram, Telemetry, Report) -->
  <circle cx="32" cy="14" r="3.5" fill="#00ffaa" />
  <circle cx="50" cy="48" r="3.5" fill="#ffd000" />
  <circle cx="14" cy="48" r="3.5" fill="#00f0ff" />
  <!-- Connecting rays -->
  <line x1="32" y1="37" x2="32" y2="14" stroke="#00ffaa" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="32" y1="37" x2="50" y2="48" stroke="#ffd000" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="32" y1="37" x2="14" y2="48" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
